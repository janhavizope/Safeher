services:
  - type: web
    name: safeher-hackathon
    env: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MAPPLS_REST_API_KEY
        sync: false
      - key: MAPPLS_MAP_SDK_KEY
        sync: false
      - key: MAPPLS_CLIENT_ID
        sync: false
      - key: MAPPLS_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OWNER_OPEN_ID
        sync: false