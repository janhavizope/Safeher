services:
  - type: web
    name: safeher-hackathon
    env: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MAPPLS_REST_API_KEY
        sync: false
      - key: MAPPLS_MAP_SDK_KEY
        sync: false
      - key: MAPPLS_MAP_API_KEY
        sync: false
      - key: MAPMYINDIA_REST_API_KEY
        sync: false
      - key: MAPMYINDIA_MAP_KEY
        sync: false
      - key: MAPPLS_CLIENT_ID
        sync: false
      - key: MAPPLS_CLIENT_SECRET
        sync: false
      - key: MAPMYINDIA_CLIENT_ID
        sync: false
      - key: MAPMYINDIA_CLIENT_SECRET
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: VITE_OAUTH_PORTAL_URL
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: VITE_FRONTEND_FORGE_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OWNER_OPEN_ID
        sync: false